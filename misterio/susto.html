<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #susto {
            position: fixed;
            inset: 0;
            display: none;
            background: black;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #susto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #final {
            display: none;
            min-height: 100vh;
            text-align: center;
            padding-top: 80px;
        }

        #final h1 {
            font-size: 42px;
            margin-bottom: 30px;
        }

        #final img {
            max-width: 500px;
            width: 80%;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div id="susto">
        <img src="../imagenes/screamer.jpg" alt="">
    </div>

    <div id="final">
        <h1>Felicidades por perder el tiempo.</h1>
        <img src="../imagenes/final.jpg" alt="👍">
    </div>

    <script>
        setTimeout(function() {
            document.getElementById("susto").style.display = "flex";

            setTimeout(function() {
                document.getElementById("susto").style.display = "none";
                document.getElementById("final").style.display = "block";
                document.body.style.overflow = "auto";
            }, 2500);

        }, 1500);
    </script>

</body>
</html>
