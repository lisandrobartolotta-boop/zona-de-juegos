<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>...</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: red;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .misterio {
            width: 700px;
            max-width: 90%;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 35px;
        }

        .morse {
            font-family: monospace;
            font-size: 25px;
            letter-spacing: 5px;
            margin-bottom: 30px;
        }

        .pista {
            width: 500px;
            max-width: 100%;
            border: 1px solid #330000;
        }

        p {
            font-size: 16px;
            margin-top: 30px;
        }

        input {
            background: black;
            color: red;
            border: 1px solid red;
            padding: 12px;
            font-size: 18px;
            outline: none;
            width: 250px;
            text-align: center;
        }

        button {
            display: block;
            margin: 15px auto;
            padding: 10px 25px;

            background: black;
            color: red;
            border: 1px solid red;

            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: red;
            color: black;
        }

        #mensaje {
            min-height: 25px;
        }
    </style>
</head>

<body>

<div class="misterio">

    <h1>...</h1>

    <div class="morse">
        .--. .- ... ... .-- --- .-. -..
    </div>

    <img
        src="../imagenes/pista.png"
        class="pista"
        alt=""
    >

    <p>Hay algo que no estás viendo.</p>

    <input
        type="text"
        id="respuesta"
        placeholder="Contraseña"
        autocomplete="off"
    >

    <button onclick="comprobar()">Continuar</button>

    <p id="mensaje"></p>

</div>


<script>

function comprobar() {

    const respuesta = document
        .getElementById("respuesta")
        .value
        .trim()
        .toLowerCase();

    if (respuesta === "sombras") {

        window.location.href = "secreto.html";

    } else {

        document.getElementById("mensaje").textContent =
            "Contraseña incorrecta.";
    }
}

</script>

</body>

</html>
