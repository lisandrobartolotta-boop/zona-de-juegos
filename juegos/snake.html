<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Snake</title>

    <style>
        body {
            margin: 0;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .juego {
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .marcador {
            font-size: 20px;
            margin-bottom: 10px;
        }

        canvas {
            background: black;
            border: 4px solid white;
            display: block;
            margin: auto;
        }

        #mensaje {
            font-weight: bold;
            min-height: 24px;
        }

        #reiniciar {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="juego">

    <h1>🐍 SNAKE</h1>

    <div class="marcador">
        Puntaje: <span id="puntaje">0</span>
    </div>

    <canvas id="juego" width="400" height="400"></canvas>

    <p id="mensaje">Usá las flechas para moverte</p>

    <button id="reiniciar">Jugar de nuevo</button>

</div>

<script>

const canvas = document.getElementById("juego");
const ctx = canvas.getContext("2d");

const puntajeHTML = document.getElementById("puntaje");
const mensaje = document.getElementById("mensaje");
const reiniciar = document.getElementById("reiniciar");

const tamaño = 20;
const cantidad = canvas.width / tamaño;

let serpiente;
let comida;
let direccion;
let siguienteDireccion;
let puntaje;
let juegoTerminado;
let intervalo;


function iniciarJuego() {

    clearInterval(intervalo);

    serpiente = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];

    direccion = { x: 1, y: 0 };
    siguienteDireccion = { x: 1, y: 0 };

    puntaje = 0;
    juegoTerminado = false;

    puntajeHTML.textContent = puntaje;
    mensaje.textContent = "Usá las flechas para moverte";

    crearComida();

    dibujar();

    intervalo = setInterval(actualizar, 120);
}


function crearComida() {

    let posiciónCorrecta = false;

    while (!posiciónCorrecta) {

        comida = {
            x: Math.floor(Math.random() * cantidad),
            y: Math.floor(Math.random() * cantidad)
        };

        posiciónCorrecta = true;

        for (let parte of serpiente) {

            if (
                parte.x === comida.x &&
                parte.y === comida.y
            ) {
                posiciónCorrecta = false;
                break;
            }
        }
    }
}


function actualizar() {

    if (juegoTerminado) {
        return;
    }

    direccion = siguienteDireccion;

    const cabeza = {
        x: serpiente[0].x + direccion.x,
        y: serpiente[0].y + direccion.y
    };


    // Chocar contra las paredes
    if (
        cabeza.x < 0 ||
        cabeza.x >= cantidad ||
        cabeza.y < 0 ||
        cabeza.y >= cantidad
    ) {
        perder();
        return;
    }


    // Chocar contra el cuerpo
    for (let parte of serpiente) {

        if (
            cabeza.x === parte.x &&
            cabeza.y === parte.y
        ) {
            perder();
            return;
        }
    }


    serpiente.unshift(cabeza);


    // Comer
    if (
        cabeza.x === comida.x &&
        cabeza.y === comida.y
    ) {

        puntaje++;
        puntajeHTML.textContent = puntaje;

        crearComida();

    } else {

        serpiente.pop();

    }


    dibujar();
}


function dibujar() {

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);


    // Comida
    ctx.fillStyle = "red";

    ctx.fillRect(
        comida.x * tamaño,
        comida.y * tamaño,
        tamaño,
        tamaño
    );


    // Serpiente
    ctx.fillStyle = "lime";

    for (let parte of serpiente) {

        ctx.fillRect(
            parte.x * tamaño,
            parte.y * tamaño,
            tamaño - 1,
            tamaño - 1
        );
    }
}


function perder() {

    juegoTerminado = true;

    clearInterval(intervalo);

    mensaje.textContent =
        "💀 GAME OVER — Puntaje: " + puntaje;
}


document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp" && direccion.y !== 1) {
        siguienteDireccion = { x: 0, y: -1 };
    }

    if (event.key === "ArrowDown" && direccion.y !== -1) {
        siguienteDireccion = { x: 0, y: 1 };
    }

    if (event.key === "ArrowLeft" && direccion.x !== 1) {
        siguienteDireccion = { x: -1, y: 0 };
    }

    if (event.key === "ArrowRight" && direccion.x !== -1) {
        siguienteDireccion = { x: 1, y: 0 };
    }

});


reiniciar.addEventListener("click", iniciarJuego);


iniciarJuego();

</script>

</body>
</html>
